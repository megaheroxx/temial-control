services:
  temial-control:
    image: ghcr.io/megaheroxx/temial-control:latest
    pull_policy: always
    container_name: temial-control
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # APP_TOKEN: "a-long-secret-token"
      # BASE_HOST: "http://192.168.178.20:3000"  # IP of the Docker host, only used for the startup output
      # APP_LANGUAGE: de  # default language of server messages and presets (en or de)
      TZ: Europe/Berlin
    volumes:
      - temial-data:/data

volumes:
  temial-data:
