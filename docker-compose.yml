services:
  temial-control:
    build: .
    image: temial-control:latest
    container_name: temial-control
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # APP_TOKEN: "ein-langes-geheimes-token"
      # BASE_HOST: "http://192.168.178.20:3000"  # IP des Docker-Hosts, nur für die Startausgabe
      TZ: Europe/Berlin
    volumes:
      - temial-data:/data

volumes:
  temial-data:
