<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)">
  <title>Temial Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4c-7 0-13 3.5-13 10 0 1.6.5 3 1.3 4.1C6.4 19.6 5 21 5 21l1 1s1.6-1.5 3.3-3.3A6 6 0 0 0 11 19c6.5 0 9-6 9-15Zm-9 13c-.6 0-1.1-.1-1.6-.3C11.6 14.4 14 12 16 10c-2.6 1.2-5.5 3.6-7.6 6.2A5.6 5.6 0 0 1 9 14c0-4.7 4.1-7.4 9-7.9-.4 6.4-2.6 10.9-7 10.9Z"/></svg>
      <span>Temial Control</span>
    </div>
    <div class="appbar-actions">
      <button type="button" id="language" class="lang-button" data-i18n="app.switchLanguage"></button>
      <span id="connection" class="status-pill" data-i18n="app.connecting"></span>
      <a id="app-settings" class="icon-button" href="app://settings" data-i18n-aria-label="app.settings" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section id="devices" aria-live="polite">
      <div class="card empty">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 8h13v5a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V8Zm13 1h1.5a2.5 2.5 0 0 1 0 5H17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 2.5c0 1 1 1 1 2s-1 1-1 2M12 2.5c0 1 1 1 1 2s-1 1-1 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <h2 data-i18n="empty.title"></h2>
        <p data-i18n-html="empty.text"></p>
      </div>
    </section>

    <section class="card" id="brew">
      <div class="section-head">
        <h2 data-i18n="brew.title"></h2>
        <label class="device-picker">
          <span class="visually-hidden" data-i18n="brew.device"></span>
          <select name="device" form="brew-form" required></select>
        </label>
      </div>

      <div class="tea-tiles" id="tea-tiles" role="listbox" data-i18n-aria-label="brew.presets"></div>

      <div class="tea-colors" id="tea-colors" hidden>
        <span data-i18n="brew.colour"></span>
        <div class="swatches" id="swatches" role="radiogroup" data-i18n-aria-label="brew.colourLabel"></div>
      </div>

      <form id="brew-form">
        <select name="preset" hidden><option value="" data-i18n="brew.customRecipe"></option></select>
        <label class="field">
          <span data-i18n="brew.name"></span>
          <input name="name" required maxlength="40" data-i18n-value="brew.defaultName">
        </label>

        <div class="sliders">
          <label class="slider">
            <span data-i18n="brew.temperature"></span><input class="slider-value" data-for="temperature" inputmode="numeric" enterkeyhint="done" data-i18n-aria-label="brew.temperatureLabel">
            <input name="temperature" type="range" min="40" max="100" step="1" value="90" required>
          </label>
          <label class="slider">
            <span data-i18n="brew.duration"></span><input class="slider-value" data-for="duration" inputmode="decimal" enterkeyhint="done" data-i18n-aria-label="brew.durationLabel">
            <input name="duration" type="range" min="10" max="1800" step="1" value="180" required>
          </label>
          <label class="slider">
            <span data-i18n="brew.volume"></span><input class="slider-value" data-for="volume" inputmode="numeric" enterkeyhint="done" data-i18n-aria-label="brew.volumeLabel">
            <input name="volume" type="range" min="50" max="1000" step="1" value="350" required>
          </label>
          <label class="slider">
            <span data-i18n="brew.preWash"></span><input class="slider-value" data-for="preWashTime" inputmode="numeric" enterkeyhint="done" data-i18n-aria-label="brew.preWashLabel">
            <input name="preWashTime" type="range" min="0" max="60" step="1" value="10" required>
          </label>
        </div>

        <div class="infusions">
          <div class="infusions-head">
            <span data-i18n="brew.infusions"></span>
            <div class="segmented" id="infusion-count" role="radiogroup" data-i18n-aria-label="brew.infusionsLabel"></div>
          </div>
          <div id="infusion-steps"></div>
        </div>

        <div class="start-row">
          <span data-i18n="brew.start"></span>
          <div class="segmented" role="radiogroup" data-i18n-aria-label="brew.startLabel">
            <button type="button" class="segment" data-start="now" role="radio" aria-checked="true" data-i18n="brew.now"></button>
            <button type="button" class="segment" data-start="later" role="radio" aria-checked="false" data-i18n="brew.later"></button>
          </div>
        </div>
        <div class="start-later" id="start-later" hidden>
          <label class="field">
            <span data-i18n="brew.time"></span>
            <input type="time" id="start-time" step="300">
          </label>
          <p class="hint" id="start-hint"></p>
        </div>

        <button type="submit" class="primary wide" data-i18n="brew.brewNow"></button>
        <div class="actions center">
          <button type="button" id="update-preset" class="link accent" hidden data-i18n="brew.updatePreset"></button>
          <button type="button" id="save-preset" class="link" data-i18n="brew.savePreset"></button>
          <button type="button" id="delete-preset" class="link danger" hidden data-i18n="brew.deletePreset"></button>
        </div>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section class="card" id="stats">
      <div class="section-head"><h2 data-i18n="stats.title"></h2></div>
      <div class="stat-tiles">
        <div class="stat"><span class="stat-value" id="stat-today">–</span><span class="stat-label" data-i18n="stats.today"></span></div>
        <div class="stat"><span class="stat-value" id="stat-week">–</span><span class="stat-label" data-i18n="stats.week"></span></div>
        <div class="stat"><span class="stat-value" id="stat-total">–</span><span class="stat-label" data-i18n="stats.total"></span></div>
        <div class="stat"><span class="stat-value" id="stat-liters">–</span><span class="stat-label" data-i18n="stats.liters"></span></div>
      </div>
      <p class="hint" id="stats-empty" hidden data-i18n="stats.empty"></p>
      <div id="stats-body">
        <figure class="chart">
          <figcaption data-i18n="stats.chart"></figcaption>
          <div class="bars" id="stat-days"></div>
          <table class="visually-hidden" id="stat-table">
            <thead><tr><th data-i18n="stats.day"></th><th data-i18n="stats.cupsHeader"></th></tr></thead>
            <tbody></tbody>
          </table>
        </figure>
        <h3 data-i18n="stats.favorites"></h3>
        <ol class="favorites" id="stat-favorites"></ol>
        <details class="history">
          <summary><h3 data-i18n="stats.history"></h3></summary>
          <ol id="history-list"></ol>
        </details>
      </div>
    </section>

    <section class="card" id="setup">
      <details>
        <summary><h2 data-i18n="setup.title"></h2></summary>
        <div id="app-setup" class="app-setup" hidden>
          <p data-i18n="setup.appIntro"></p>
          <a class="button primary" href="app://setup" data-i18n="setup.appButton"></a>
          <p class="hint" data-i18n="setup.appOr"></p>
        </div>
        <p class="hint" data-i18n-html="setup.intro"></p>

        <form id="setup-form">
          <fieldset>
            <legend><span class="step">1</span> <span data-i18n="setup.step1"></span></legend>
            <p class="hint" data-i18n="setup.step1Hint"></p>
            <label class="field">
              <span data-i18n="setup.qrContent"></span>
              <input name="qr" required autocomplete="off" spellcheck="false" data-i18n-placeholder="setup.qrPlaceholder">
            </label>
            <div class="actions">
              <button type="button" id="qr-camera" class="secondary" hidden data-i18n="setup.camera"></button>
              <label class="button secondary"><span data-i18n="setup.photo"></span>
                <input type="file" id="qr-photo" accept="image/*" capture="environment" hidden>
              </label>
            </div>
            <video id="qr-video" playsinline muted hidden></video>
            <p id="qr-info" class="hint"></p>
          </fieldset>

          <fieldset>
            <legend><span class="step">2</span> <span data-i18n="setup.step2"></span></legend>
            <label class="field">
              <span data-i18n="setup.ssid"></span>
              <input name="ssid" list="ssid-list" required maxlength="32" autocomplete="off">
              <datalist id="ssid-list"></datalist>
            </label>
            <label class="field">
              <span data-i18n="setup.key"></span>
              <input name="key" type="password" maxlength="63" autocomplete="off">
            </label>
            <label class="field">
              <span data-i18n="setup.security"></span>
              <select name="securityType"><option value="" data-i18n="setup.securityAuto"></option></select>
            </label>
            <label class="field">
              <span data-i18n="setup.baseHost"></span>
              <input name="baseHost" list="basehost-list" required maxlength="64" placeholder="http://192.168.178.20:3000">
              <datalist id="basehost-list"></datalist>
            </label>
            <p class="hint" data-i18n="setup.baseHostHint"></p>
          </fieldset>

          <fieldset>
            <legend><span class="step">3</span> <span data-i18n="setup.step3"></span></legend>
            <p data-i18n-html="setup.switchWifi"></p>
            <div class="actions">
              <button type="submit" id="setup-submit" class="primary" data-i18n="setup.submit"></button>
              <button type="button" id="setup-scan" class="secondary" data-i18n="setup.scan"></button>
            </div>
          </fieldset>

          <ol id="setup-steps"></ol>
          <p id="setup-message" role="status"></p>
        </form>
      </details>
    </section>

    <section class="card">
      <details>
        <summary><h2 data-i18n="log.title"></h2></summary>
        <ol id="log"></ol>
      </details>
    </section>
  </main>

  <footer data-i18n-html="app.footer"></footer>

  <template id="device-template">
    <article class="card device">
      <div class="device-head">
        <div>
          <h2 class="device-name"></h2>
          <p class="device-sub"></p>
        </div>
        <span class="status-pill state"></span>
      </div>

      <div class="device-body">
        <div class="bezel" aria-hidden="true">
          <div class="screen">
            <div class="screen-ring" hidden>
              <svg viewBox="0 0 120 120">
                <circle class="ring-track" cx="60" cy="60" r="52"/>
                <circle class="ring-value" cx="60" cy="60" r="52"/>
              </svg>
              <div class="ring-label">
                <strong class="ring-time"></strong>
                <span class="ring-caption" data-i18n="device.remaining"></span>
              </div>
            </div>
            <div class="screen-icon"></div>
            <p class="screen-title"></p>
            <p class="screen-text"></p>
          </div>
        </div>

        <div class="device-info">
          <dl class="brew-stats" hidden></dl>
          <div class="scheduled-box" hidden>
            <p class="scheduled-text"></p>
            <button type="button" class="secondary danger cancel-timer" data-i18n="device.cancelTimer"></button>
          </div>
          <div class="infusion-next" hidden>
            <p class="infusion-text"></p>
            <div class="infusion-buttons">
              <button type="button" class="primary next-infusion"></button>
              <button type="button" class="secondary finish-infusions" data-i18n="device.finish"></button>
            </div>
          </div>
          <div class="brew-actions" hidden>
            <button type="button" class="secondary pause-button" data-i18n="device.pause"></button>
            <button type="button" class="secondary danger cancel-button" data-i18n="device.cancel"></button>
          </div>
          <ul class="checks"></ul>
        </div>
      </div>
      <p class="meta"></p>
    </article>
  </template>

  <script src="/i18n.js" type="module"></script>
  <script src="/app.js" type="module"></script>
  <script src="/setup.js" type="module"></script>
  <script src="/stats.js" type="module"></script>
</body>
</html>
