name: Home Assistant

on:
  push:
    paths: ['custom_components/**', 'tests_ha/**', 'pyproject.toml', 'hacs.json', '.github/workflows/homeassistant.yml']
  pull_request:
    paths: ['custom_components/**', 'tests_ha/**', 'pyproject.toml', 'hacs.json', '.github/workflows/homeassistant.yml']
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest -q
