name: Android-App

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt, die APK wird mit dem Debug-Schlüssel signiert"
          fi

      - name: Tests und APK bauen
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: APK benennen
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/temial-control-$version.apk"
          echo "APK=dist/temial-control-$version.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: temial-control-apk
          path: ${{ env.APK }}

      - name: An das Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
